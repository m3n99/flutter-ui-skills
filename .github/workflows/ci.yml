name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned, so a new stable can't break the build without a change here. To
  # move it: change the number, run CI, look at the screenshots. The
  # material_ui leg needs 3.50 or later. The fonts are pinned in
  # scripts/fetch_fonts.sh.
  FLUTTER_VERSION: 3.50.0

jobs:
  plugin:
    name: Plugin manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON manifests are valid
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/flutter-modern-ui/.claude-plugin/plugin.json

      - name: Skills and agents have name and description
        run: |
          status=0
          for f in plugins/flutter-modern-ui/skills/*/SKILL.md plugins/flutter-modern-ui/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing frontmatter"; status=1; }
            grep -q '^name: ' "$f" || { echo "::error file=$f::missing name"; status=1; }
            grep -q '^description: ' "$f" || { echo "::error file=$f::missing description"; status=1; }
          done
          exit $status

      - name: Files referenced from skills exist
        run: |
          status=0
          for skill in plugins/flutter-modern-ui/skills/*; do
            for md in "$skill"/SKILL.md "$skill"/references/*.md; do
              [ -f "$md" ] || continue
              dir=$(dirname "$md")
              grep -oE '`((\.\./)+[a-z_-]+/|references/|assets/|scripts/)[A-Za-z0-9_./-]+\.(md|dart|sh|py)`' "$md" | tr -d '`' | sort -u | while read -r ref; do
                [ -e "$dir/$ref" ] || [ -e "$skill/$ref" ] || { echo "::error file=$md::missing reference $ref"; echo x >> /tmp/missing; }
              done
            done
          done
          [ ! -f /tmp/missing ] || status=1
          exit $status

      - name: The reviewer agent and the visual-review guide list the same checks
        run: |
          names() { grep -oE '^[0-9]+\. \*\*[^*]+\*\*' "$1"; }
          agent=$(names plugins/flutter-modern-ui/agents/flutter-ui-reviewer.md)
          guide=$(sed -n '/^## Per screenshot/,/^## Across the set/p' plugins/flutter-modern-ui/skills/flutter-ui-verify/references/visual-review.md | grep -oE '^[0-9]+\. \*\*[^*]+\*\*')
          [ "$agent" = "$guide" ] || { echo "::error::the two review lists differ"; diff <(echo "$agent") <(echo "$guide"); exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The lint finds what it says it finds (ci/lint_selftest.py)
        run: python ci/lint_selftest.py

      - name: Examples and widgets follow the rules a grep can see (lint_ui.py)
        run: python plugins/flutter-modern-ui/skills/flutter-modern-ui/scripts/lint_ui.py plugins/flutter-modern-ui/skills/flutter-modern-ui/assets

      - name: Plugin and marketplace versions match, and the changelog has the version
        run: |
          version=$(jq -r .version plugins/flutter-modern-ui/.claude-plugin/plugin.json)
          listed=$(jq -r '.plugins[] | select(.name == "flutter-modern-ui") | .version' .claude-plugin/marketplace.json)
          [ "$version" = "$listed" ] || { echo "::error::plugin.json says $version, marketplace.json says $listed"; exit 1; }
          grep -q "^## \[\?$version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }

      - name: The examples' fonts cover every character they show (check_glyphs.py)
        run: |
          python -m pip install --quiet fonttools
          bash scripts/fetch_fonts.sh build/fonts Regular Bold
          python plugins/flutter-modern-ui/skills/flutter-ui-verify/scripts/check_glyphs.py \
            --font build/fonts/IBMPlexSansArabic-Regular.ttf --font build/fonts/IBMPlexSansArabic-Bold.ttf \
            plugins/flutter-modern-ui/skills/flutter-modern-ui/assets

      - name: Scripts run (help, kit list)
        run: |
          for script in plugins/flutter-modern-ui/skills/*/scripts/*.py; do python "$script" --help > /dev/null; done
          python plugins/flutter-modern-ui/skills/flutter-modern-ui/scripts/copy_design_system.py --list

      - name: The copy scripts stamp, report and update (status, diff, update)
        run: |
          copy=plugins/flutter-modern-ui/skills/flutter-modern-ui/scripts/copy_design_system.py
          mkdir -p build/copytest && cd build/copytest
          printf 'name: app\ndependencies:\n  flutter:\n    sdk: flutter\n' > pubspec.yaml
          python "../../$copy" --kit all
          jq -e '.version and (.files | length == 27)' lib/core/design_system/.flutter-modern-ui.json
          # A file the plugin changed and the user didn't: --update takes it.
          # A file the user edited: left alone.
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("lib/core/design_system")
          stamp = json.loads((root / ".flutter-modern-ui.json").read_text())
          (root / "widgets/ltr.dart").write_text("// an older template\n")
          stamp["files"]["widgets/ltr.dart"]["sha256"] = hashlib.sha256(b"// an older template\n").hexdigest()
          (root / ".flutter-modern-ui.json").write_text(json.dumps(stamp))
          with (root / "tokens.dart").open("a") as f:
              f.write("// the project's own token\n")
          PY
          python "../../$copy" --status | tee status.txt
          grep -q "widgets/ltr.dart: changed in the plugin" status.txt
          grep -q "tokens.dart: edited by you" status.txt
          python "../../$copy" --update
          grep -q "class Ltr" lib/core/design_system/widgets/ltr.dart
          grep -q "the project's own token" lib/core/design_system/tokens.dart
          python "../../$copy" --diff tokens.dart | grep -q "the project's own token"

  templates:
    # material_ui: what `flutter create` makes from Flutter 3.50 (the copy
    # scripts rewrite every Material import). framework: an app still on
    # package:flutter/material.dart.
    name: Templates (${{ matrix.material }}) compile, UI and PDF tests, screenshots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        material: [material_ui, framework]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter --version

      - name: Build the sandbox app from the templates
        id: sandbox
        run: bash scripts/sandbox.sh ${{ matrix.material == 'material_ui' && '--material-ui' || '--framework-material' }} build/sandbox

      # Each check below runs even when an earlier one failed, so one run
      # shows every failure (and still uploads the screenshots and pages).

      - name: Analyze
        working-directory: build/sandbox
        run: flutter analyze --no-fatal-infos

      - name: UI tests (layout matrix, sheets, contrast, shared widgets)
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/ui

      - name: Repo tests (example behaviour, PDF checks catch what they should)
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/ci

      - name: Printed documents (sample PDFs, block checks)
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/pdf

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        with:
          python-version: '3.12'

      - name: Rasterize the printed pages and check their text
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        run: |
          python -m pip install --quiet pymupdf
          python plugins/flutter-modern-ui/skills/flutter-ui-verify/scripts/rasterize_pdf.py build/sandbox/test/pdf/out --text

      - name: Screenshots
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/ui/visual_test.dart test/ui/sheets_test.dart --update-goldens --dart-define=VISUAL=true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.material }}
          path: |
            build/sandbox/test/ui/screenshots/
            build/sandbox/test/pdf/out/
          if-no-files-found: ignore
