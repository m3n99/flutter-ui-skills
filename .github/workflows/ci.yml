name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: Plugin manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON manifests are valid
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/flutter-modern-ui/.claude-plugin/plugin.json

      - name: Skills and agents have name and description
        run: |
          status=0
          for f in plugins/flutter-modern-ui/skills/*/SKILL.md plugins/flutter-modern-ui/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing frontmatter"; status=1; }
            grep -q '^name: ' "$f" || { echo "::error file=$f::missing name"; status=1; }
            grep -q '^description: ' "$f" || { echo "::error file=$f::missing description"; status=1; }
          done
          exit $status

      - name: Files referenced from skills exist
        run: |
          status=0
          for skill in plugins/flutter-modern-ui/skills/*; do
            for md in "$skill"/SKILL.md "$skill"/references/*.md; do
              [ -f "$md" ] || continue
              dir=$(dirname "$md")
              grep -oE '`((\.\./)+[a-z_-]+/|references/|assets/|scripts/)[A-Za-z0-9_./-]+\.(md|dart|sh|py)`' "$md" | tr -d '`' | sort -u | while read -r ref; do
                [ -e "$dir/$ref" ] || [ -e "$skill/$ref" ] || { echo "::error file=$md::missing reference $ref"; echo x >> /tmp/missing; }
              done
            done
          done
          [ ! -f /tmp/missing ] || status=1
          exit $status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Examples and widgets follow the non-negotiables (lint_ui.py)
        run: python plugins/flutter-modern-ui/skills/flutter-modern-ui/scripts/lint_ui.py plugins/flutter-modern-ui/skills/flutter-modern-ui/assets

      - name: The examples' fonts cover every character they show (check_glyphs.py)
        run: |
          python -m pip install --quiet fonttools
          mkdir -p build/fonts
          for weight in Regular Bold; do
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-$weight.ttf" -o "build/fonts/IBMPlexSansArabic-$weight.ttf"
          done
          python plugins/flutter-modern-ui/skills/flutter-ui-verify/scripts/check_glyphs.py \
            --font build/fonts/IBMPlexSansArabic-Regular.ttf --font build/fonts/IBMPlexSansArabic-Bold.ttf \
            plugins/flutter-modern-ui/skills/flutter-modern-ui/assets

      - name: Scripts run (help, kit list)
        run: |
          for script in plugins/flutter-modern-ui/skills/*/scripts/*.py; do python "$script" --help > /dev/null; done
          python plugins/flutter-modern-ui/skills/flutter-modern-ui/scripts/copy_design_system.py --list

  templates:
    # material_ui: what `flutter create` makes from Flutter 3.50 (the copy
    # scripts rewrite every Material import). framework: an app still on
    # package:flutter/material.dart.
    name: Templates (${{ matrix.material }}) compile, UI and PDF tests, screenshots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        material: [material_ui, framework]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Build the sandbox app from the templates
        id: sandbox
        run: bash scripts/sandbox.sh ${{ matrix.material == 'material_ui' && '--material-ui' || '--framework-material' }} build/sandbox

      # Each check below runs even when an earlier one failed, so one run
      # shows every failure (and still uploads the screenshots and pages).

      - name: Analyze
        working-directory: build/sandbox
        run: flutter analyze --no-fatal-infos

      - name: UI tests (layout matrix, sheets, contrast, shared widgets)
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/ui

      - name: Repo tests (example behaviour, PDF checks catch what they should)
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/ci

      - name: Printed documents (sample PDFs, block checks)
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/pdf

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        with:
          python-version: '3.12'

      - name: Rasterize the printed pages and check their text
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        run: |
          python -m pip install --quiet pymupdf
          python plugins/flutter-modern-ui/skills/flutter-ui-verify/scripts/rasterize_pdf.py build/sandbox/test/pdf/out --text

      - name: Screenshots
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        working-directory: build/sandbox
        run: flutter test test/ui/visual_test.dart test/ui/sheets_test.dart --update-goldens --dart-define=VISUAL=true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.material }}
          path: |
            build/sandbox/test/ui/screenshots/
            build/sandbox/test/pdf/out/
          if-no-files-found: ignore
